name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: HACS action
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Hassfest
        uses: home-assistant/actions/hassfest@master

  yaml-packages:
    name: YAML package syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install -r tests/requirements.txt

      - name: Validate package YAML files
        run: python tests/validate_yaml_packages.py

  blueprint:
    name: Blueprint structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check blueprint file and required keys
        run: python tests/validate_blueprint.py

  brand:
    name: HACS brand assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check brand icon
        run: python tests/validate_brand.py

  license:
    name: License file
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate LICENSE contains MIT SPDX identifier
        run: python tests/validate_license.py

  irrigation-parser:
    name: Irrigation prompt + Reach heuristics
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install -r tests/requirements.txt

      - name: Run unit tests and mock watering matrix
        run: |
          python -m unittest tests/test_parse_irrigation_minutes.py tests/test_prompt_assembly.py tests/test_probe_heuristics.py tests/test_scenario_matrix.py tests/test_mock_reach.py tests/test_script_minutes_jinja.py tests/test_overlay_and_mtls.py -v
          python scripts/mock_watering_run.py
